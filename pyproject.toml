[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfuzzy"
version = "0.2.1"
description = "DeepFuzzyTorch: A Unified Differentiable Intuitionistic, Hesitant, and Fuzzy-Rough Granular Framework for Incomplete and Conflicting Multimodal Medical Learning"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Guanqun Sun", email = "sunguanqun@hmc.edu.cn"}
]
keywords = [
    "intuitionistic fuzzy sets",
    "hesitant fuzzy sets",
    "fuzzy-rough sets",
    "choquet integral",
    "multimodal fusion",
    "missing modality",
    "medical AI",
    "computational pathology",
    "multi-omics",
    "pytorch"
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "scikit-learn>=1.2.0",
    "pandas>=1.5.0",
    "matplotlib>=3.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
benchmark = ["xgboost>=1.7.0", "catboost>=1.2.0", "tabpfn>=2.0.0"]
all = ["pytest>=7.0.0", "xgboost>=1.7.0", "catboost>=1.2.0", "tabpfn>=2.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["deepfuzzy*"]

[tool.setuptools.package-data]
deepfuzzy = ["*.json"]
